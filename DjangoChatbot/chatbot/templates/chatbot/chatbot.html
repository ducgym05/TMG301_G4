<!DOCTYPE html>
<html>
<head>
    <title>Gemini Chatbot</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* CSS được giữ nguyên để đơn giản, nhưng tôi đã điều chỉnh một chút cho khối code */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        #chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #007bff;
            color: #fff;
            margin-left: auto;
            align-self: flex-end;
        }
        .bot-message {
            background-color: #e9e9eb;
            color: #000;
            align-self: flex-start;
            border-radius: 8px; 
            padding: 12px; 
            max-width: 90%;
        }
        /* Định dạng đặc biệt cho khối code để highlight.js hoạt động tốt */
        .bot-message pre { 
            margin: 0;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            /* Đảm bảo màu nền và chữ do highlight.js xử lý, nên bỏ background-color cũ */
        }
        /* Định dạng code nội dòng */
        .bot-message code { 
            background-color: #ccc;
            padding: 2px 4px;
            border-radius: 4px;
        }

        #chat-form {
            padding: 10px;
            display: flex;
            border-top: 1px solid #ccc;
        }
        #user-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            margin-right: 10px;
        }
        #chat-form button {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="chat-box"></div>
        <form id="chat-form">
            {% csrf_token %}
            <input type="text" id="user-input" placeholder="Nhập tin nhắn...">
            <button type="submit">Gửi</button>
        </form>
    </div>

    <script>
        document.getElementById('chat-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const userInput = document.getElementById('user-input').value;
            if (userInput.trim() === '') return;

            const chatBox = document.getElementById('chat-box');
            // Thêm tin nhắn người dùng
            chatBox.innerHTML += `<div class="message user-message">${userInput}</div>`;
            document.getElementById('user-input').value = ''; // Xóa input

            // Gửi tin nhắn đến Django
            fetch('chat_response/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ message: userInput })
            })
            .then(response => response.json())
            .then(data => {
                // Chuyển đổi Markdown sang HTML
                const htmlContent = marked.parse(data.message); 

                // Hiển thị tin nhắn bot đã được định dạng
                const botMessageElement = document.createElement('div');
                botMessageElement.className = 'message bot-message';
                botMessageElement.innerHTML = htmlContent;
                chatBox.appendChild(botMessageElement);
                
                // Khởi tạo Syntax Highlighting cho khối code mới
                hljs.highlightAll(); 
                
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        });

        // Hàm lấy CSRF token (giữ nguyên)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
